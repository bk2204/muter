name: ci
on: [push, pull_request]

jobs:
  build-bookworm:
    name: Linux (Debian bookworm amd64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
    - run: make ci-bookworm
    - uses: actions/upload-artifact@v6
      with:
        name: bookworm-amd64-deb
        path: target/assets/muter_*.deb
  build-bookworm-arm64:
    name: Linux (Debian bookworm arm64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
    - run: |
        echo '{"experimental": true}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker.service
        docker version -f '{{.Server.Experimental}}'
    - uses: docker/setup-qemu-action@v1
    - run: make ci-bookworm
      env:
        PLATFORM: linux/arm64
    - uses: actions/upload-artifact@v6
      with:
        name: bookworm-arm64-deb
        path: target/assets/muter_*.deb
  build-oldest:
    name: Linux (oldest Rust)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
    - run: make ci-oldest
  build-stable:
    name: Linux (Rust stable)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
    - run: make ci-stable
      env:
        FEATURES: modern
  build-nightly:
    name: Linux (Rust nightly)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
    - run: make ci-nightly
      env:
        FEATURES: modern
  build-mac:
    name: macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - run: brew install ruby asciidoctor rust
    - run: make test-full
      env:
        FEATURES: modern


